<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portfolio</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Initial Loading Screen -->
    <div id="loading-screen" role="progressbar">
        <div class="loading-spinner"></div>
        <p class="loading-text">git init...</p>
    </div>

    <!-- Matrix Rain / Canvas Background -->
    <canvas id="matrix-rain"></canvas>

    <!-- Theme Switcher Button -->
    <button class="theme-switch" id="theme-toggle" aria-label="Toggle theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
    </button>

    <!-- Main Container -->
    <div class="container content-hidden" id="main-content">
        <header>
            <img src="assets/profile.jpg" alt="Profile Picture" class="profile-img">
            <h1 id="user-name">Your Name</h1>
            <p class="tagline">Full-Stack Engineer & Open Source Contributor</p>
            <div class="social-links" id="social-links"></div>
        </header>

        <section class="about" id="about-section"></section>

        <section class="featured-projects">
            <h2>Featured Projects</h2>
            <div class="featured-projects-grid" id="featured-projects-grid"></div>
        </section>

        <section class="projects-on-github">
            <h2>GitHub Repositories</h2>
            <div id="projects" class="projects-grid">
                <div class="loading">Loading projects...</div>
            </div>
        </section>
    </div>

    <!-- Floating AI Chatbot -->
    <div id="chat-container" class="chat-container">
        <button id="chat-toggle" class="chat-toggle" aria-label="Toggle chat">💬</button>
        <div id="chat-widget" class="chat-widget hidden">
            <div class="chat-header">
                <h3>AI ASSISTANT</h3>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="message bot">> SYSTEM INITIALIZED<br>> Ask me about my skills or projects!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Enter command...">
                <button id="chat-send">Send</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
